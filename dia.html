<style>
/* Página del día del Reto 28 días: el correo diario abre aquí. Mismo estilo que reto.html (noche + oro). */
:root{
  --bg:#0b0b0d; --card:#15130f; --line:#2f281b; --fg:#ece6d6; --mute:#a89f8a;
  --gold:#d6af55; --gold-hi:#f0ce6e; --ok:#7fbf7a; --ink:#111; --wa:#25D366;
  --f-display:Lora,Georgia,serif; --f-body:Poppins,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.6;color:var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:14px 48px}
a{color:var(--gold)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;text-decoration:none}
.top img{width:34px;height:34px;border-radius:50%}
.top span{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:15px}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--gold);margin:0}
h1{font-family:var(--f-display);color:var(--gold);font-size:clamp(32px,9vw,44px);line-height:1.15;margin:.1em 0 .3em}
.lead{margin:0 0 10px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
.count{font-size:13px;color:var(--mute);margin:0 0 14px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;transition:border-color .3s,opacity .3s}
.step.next{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.step.done{opacity:.72}
.row{display:flex;align-items:center;gap:12px}
.num{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:14px;font-weight:600}
.step.done .num{background:var(--gold);color:var(--ink)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px}
.txt small{color:var(--mute);font-size:13.5px}
.play{flex:none;display:inline-block;background:#1d1a14;border:2px solid var(--gold);color:#fff;font-weight:600;font-size:15px;
  padding:7px 13px;border-radius:12px;text-decoration:none;white-space:nowrap}
.step.done .play{border-color:var(--line);color:var(--mute)}
.ask{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:15px}
.ask button{font:600 14px var(--f-body);border-radius:999px;padding:7px 14px;margin:6px 6px 0 0;cursor:pointer}
.ask .yes{background:var(--gold);color:var(--ink);border:0}
.ask .no{background:none;color:var(--fg);border:1px solid var(--line)}
.toast{background:linear-gradient(180deg,#2c2512,#1d190f);border:1px solid var(--gold);border-radius:16px;padding:14px 16px;margin:0 0 14px;
  font-size:16px;animation:in .35s ease-out}
.toast b{color:var(--gold-hi)}
.toast.final{text-align:center;font-size:18px}
.toast.final b{display:block;font-family:var(--f-display);font-size:24px;margin-bottom:2px}
@keyframes in{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.extra{margin-top:22px;display:grid;gap:12px}
.extra p{margin:0}
.wa{display:inline-block;background:var(--wa);color:#fff;font-weight:600;padding:11px 18px;border-radius:12px;text-decoration:none;margin-top:8px}
.why{font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);margin-top:30px;padding-top:12px}
.why b{color:var(--fg)}
.err{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    }
    pintar(); window.scrollTo({top:0,behavior:'smooth'});
  }
  function volver(){ // al volver de la plataforma
    if(!st.pend||st.done.includes(st.pend.i)) return;
    const dur=(DATA.L[pasos[st.pend.i][0]].d||180)*1000;
    if(Date.now()-st.pend.t>=dur*0.8) completar(st.pend.i); else { st.pend.ask=true; store.set(KEY,st); pintar(); }
  }
  function pintar(){
    const n=st.done.length, tot=pasos.length, sig=pasos.findIndex((_,k)=>!st.done.includes(k));
    let h='<p class="kicker">Reto 28 días · Semana '+sem+'</p><h1>Día '+dia+' de 28</h1>';
    if(intro) h+='<p class="lead">'+esc(intro)+'</p>';
    h+='<p class="lead">🙏 <b>Cierra los ojos y conecta.</b> Tus Salmos de hoy:</p>';
    h+='<div class="bar" aria-hidden="true"><i style="width:'+(100*n/tot)+'%"></i></div><p class="count">'+n+' de '+tot+' pasos</p>';
    h+=toast+'<ol class="steps">';
    pasos.forEach(([s,et],i)=>{
      const d=st.done.includes(i), cls=d?'done':(i===sig?'next':'');
      h+='<li class="step '+cls+'"><div class="row"><span class="num">'+(d?'✓':i+1)+'</span><div class="txt"><b>Paso '+(i+1)+' · Salmo '+s+'</b><small>'+esc(et)+'</small></div>'+
         '<a class="play" data-i="'+i+'" href="'+esc(DATA.L[s][plat])+'" target="_blank" rel="noopener">▶ '+PLAT[plat]+'</a></div>';
      if(!d&&st.pend&&st.pend.i===i&&st.pend.ask) h+='<div class="ask">¿Lo has escuchado?<br><button class="yes" data-y="'+i+'">✓ Sí</button><button class="no" data-n="'+i+'">Todavía no</button></div>';
      h+='</li>';
    });
    h+='</ol><div class="extra">';
    h+='<p>También puedes pedírselos a Alexa: <b>«Alexa, pon el Salmo 91 de Amen Hallelujah Official»</b>.</p>';
    h+='<p>🙌 <b>Da gracias:</b> piensa en una cosa por la que das gracias hoy.</p>';
    h+='<div><p>💌 <b>Compártelo:</b> invita a alguien a hacer el reto contigo.</p><a class="wa" id="wa" href="'+SHARE+'" target="_blank" rel="noopener">💬 Compartir por WhatsApp</a></div>';
    h+='</div><p class="why"><b>¿Por qué no hay vídeos?</b><br>'+esc(WHY)+'</p>';
    C.innerHTML=h;
    C.querySelectorAll('.play').forEach(a=>a.onclick=()=>{const i=+a.dataset.i; if(!st.done.includes(i)){st.pend={i,t:Date.now()}; store.set(KEY,st);} toast=''; });
    C.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>completar(+b.dataset.y));
    C.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{st.pend=null; store.set(KEY,st); pintar();});
    const wa=document.getElementById('wa'); if(wa) wa.onclick=()=>count('/reto/compartir-whatsapp','Reto · comparte por WhatsApp');
  }
  pintar();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') volver(); });
  window.addEventListener('pageshow',e=>{ if(e.persisted) volver(); });
  volver(); // por si el navegador recargó la página al volver
}
</script>
</body>
</html>
