<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>28-Day Psalms Challenge – Amen Hallelujah Official</title>
<meta name="description" content="A free 28-day challenge with the Psalms, sung: listen a few minutes each day and learn Psalms 1, 100 and 91 by heart. Start whenever you like.">
<link rel="icon" href="../img/favicon.png">
<meta property="og:title" content="28-Day Psalms Challenge">
<meta property="og:description" content="A free 28-day challenge with the Psalms, sung: listen a few minutes each day and learn Psalms 1, 100 and 91 by heart. Start whenever you like.">
<meta property="og:image" content="../img/logo.png">
<script data-goatcounter="https://amenhallelujahofficial.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: una sola columna tipo app (máx. 560px), pantallas que se suceden como en las apps de reto; estilo de la web AHO (noche + oro) */
:root{
  --bg:#0b0b0d; --card:#15130f; --line:#2f281b; --fg:#ece6d6; --mute:#a89f8a;
  --gold:#d6af55; --gold-hi:#f0ce6e; --gold-lo:#96661c; --ok:#7fbf7a; --ink:#111;
  --f-display:Lora,Georgia,serif; --f-body:Poppins,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.6;color:var(--fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;padding-block:12px 48px}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--f-display);color:var(--gold);line-height:1.2;text-wrap:balance;margin:.2em 0}
h1{font-size:clamp(30px,8vw,44px)} h2{font-size:clamp(24px,6vw,30px)} h3{font-size:19px}
p{margin:.5em 0}
.draft{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mute);
  border:1px dashed var(--line);border-radius:10px;padding:6px 10px;margin-bottom:14px}
.draft b{color:var(--gold);letter-spacing:.08em}
.draft button{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:2px 10px;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.top img{width:38px;height:38px}
.top span{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:15px}
.screen{animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.spin{animation:none!important}}
.hero{text-align:center;padding:26px 0 6px;background:radial-gradient(ellipse at center top,#3b2c10 0,transparent 62%)}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--gold)}
.free{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:2px 12px;font-weight:600;font-size:14px;margin:8px 0}
.lead{font-size:18px;color:#f3ead2}
.verse{font-family:var(--f-display);font-style:italic;color:#f3ead2;font-size:18px}
.verse small{display:block;font-family:var(--f-body);font-style:normal;color:var(--mute);font-size:13px;margin-top:4px}
.btn{display:block;width:100%;text-align:center;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#b8902f);color:var(--ink);
  border:0;font:600 17px var(--f-body);padding:14px 20px;border-radius:999px;cursor:pointer;text-decoration:none;margin-top:14px}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn:focus-visible,.opt:focus-visible,.task input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.how{display:grid;gap:10px;margin:10px 0 18px}
.qf{border:0;padding:0;margin:0 0 22px;min-width:0}
.qf .q{font-size:17px;margin-bottom:10px;padding:0}
.qf .opts{grid-template-columns:1fr 1fr}
.qf .opts.three{grid-template-columns:repeat(3,1fr)}
.qf .opt{flex-direction:column;justify-content:center;text-align:center;gap:4px;min-height:96px;padding:12px 8px}
.qf .opt .ic{font-size:28px}
.qf .opt span{min-width:0}
.qf .opt small{font-size:12px;line-height:1.35}
.qf .opt.logo{height:auto;min-height:96px}
.row45{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:22px}
.row45 .qf{margin:0}
.row45 .q{font-size:17px;height:2.7em;display:flex;align-items:flex-end;margin-bottom:8px;float:left;width:100%}
.row45 .qf>.opts,.row45 .qf>.timeinput{clear:both}
.row45 .timeinput{font-size:16px;padding:0 2px;height:78px}
.timeinput{position:relative;display:flex;align-items:center;justify-content:center}
.timeinput::-webkit-date-and-time-value{text-align:center;margin:0 auto}
.timeinput::-webkit-datetime-edit{flex:none;margin:0 auto}
.timeinput::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer}
.row45 .opts.three{grid-template-columns:repeat(3,1fr);gap:6px}
.row45 .opt{min-height:78px;padding:6px 4px;gap:2px;font-size:12.5px;line-height:1.25}
.row45 .opt .ic{font-size:20px}
.qf .opt.logo img{max-height:34px}
.qf .opt.logo[data-v="apple"] img{max-height:25px}
.bens{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.bens li{display:block;position:relative;padding-left:32px}
.bens li::before{content:"✓";position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:#3fa34d;color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;margin-top:3px}
.bens b{color:var(--fg)}
.how div{display:flex;gap:12px;align-items:flex-start}
.how b.n{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:14px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.q{font-family:var(--f-display);font-size:24px;color:var(--fg);margin:4px 0 14px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--fg);
  border-radius:14px;padding:14px 16px;font:500 16px var(--f-body);cursor:pointer;transition:border-color .2s}
.opt:hover,.opt.on{border-color:var(--gold)}
.opt.on{background:#2a2312;box-shadow:0 0 0 1px var(--gold) inset}
.opt .ic{font-size:22px;flex:none}
.opt small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.opt.logo{justify-content:center;height:64px}
.opt.logo img{max-height:30px;max-width:100%}
.timeinput{width:100%;font:600 28px var(--f-body);text-align:center;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:12px}
.center{text-align:center}
.spin{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);margin:36px auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.steps{list-style:none;padding:0;margin:0 auto;max-width:330px;text-align:left}
.steps li{padding:4px 0;color:var(--mute);transition:color .3s}
.steps li.done{color:var(--fg)} .steps li.done::before{content:"✓ ";color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.summary{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.summary dt{color:var(--mute)} .summary dd{margin:0}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.ladder div{text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.ladder b{display:block;font-family:var(--f-display);color:var(--gold);font-size:22px}
.ladder span{font-size:12px;color:var(--mute)}
.rem{display:grid;gap:10px;margin-top:12px}
.rem .card{display:grid;gap:8px}
.rem h3{display:flex;align-items:center;gap:8px;font-family:var(--f-body);font-size:16px;color:var(--fg);margin:0}
.rem p{font-size:14px;color:var(--mute);margin:0}
.rem input[type=email]{width:100%;font:16px var(--f-body);background:#0f0e0b;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px}
.rem label.chk{display:flex;gap:8px;font-size:13px;color:var(--mute);align-items:flex-start}
.mini{font:600 15px var(--f-body);background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:9px 14px;cursor:pointer;text-decoration:none;text-align:center}
.pending{font-size:12px;color:var(--gold-lo);border:1px dashed var(--gold-lo);border-radius:8px;padding:4px 8px}
.okmsg{font-size:14px;color:var(--ok)}
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 4px}
.dayhead .big{font-family:var(--f-display);font-size:40px;color:var(--gold);line-height:1}
.dayhead .big small{font-size:18px;color:var(--mute)}
.streak{text-align:right;font-size:14px;color:var(--mute)}
.streak b{display:block;font-size:22px;color:var(--fg)}
.tasks{display:grid;gap:10px;margin:14px 0}
.task{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.task.done{border-color:#4a3d1f}
.task input[type=checkbox]{appearance:none;width:26px;height:26px;border:2px solid var(--gold);border-radius:50%;margin:2px 0 0;cursor:pointer;display:grid;place-items:center}
.task input[type=checkbox]:checked{background:var(--gold)}
.task input[type=checkbox]:checked::after{content:"✓";color:var(--ink);font-weight:700;font-size:15px}
.task .t{font-weight:600}
.task .t em{font-style:normal;color:var(--mute);font-weight:400;font-size:13px;margin-left:6px}
.task .d{font-size:14px;color:var(--mute);min-width:0}
.task textarea{width:100%;margin-top:6px;font:15px var(--f-body);background:#0f0e0b;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:60px;resize:vertical}
.listen{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-weight:600;text-decoration:none;border:1px solid var(--gold);border-radius:999px;padding:5px 12px}
.listen img{height:18px}
.alexa{font-family:var(--f-display);font-style:italic;color:#f3ead2;font-size:15px;margin-top:6px}
.daystate{font-size:14px;text-align:center;color:var(--mute)}
.daystate.ok{color:var(--ok)}
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.grid28 button{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mute);font:600 14px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
.grid28 button.done{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.grid28 button.part{border-color:var(--gold);color:var(--gold)}
.grid28 button.today{outline:2px solid var(--gold-hi);outline-offset:1px;color:var(--fg)}
.grid28 button.sel{box-shadow:0 0 0 2px var(--fg) inset}
.grid28 button:disabled{opacity:.35;cursor:default}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--mute);text-align:center}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 16px}
.badge{text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--mute)}
.badge b{display:block;font-family:var(--f-display);font-size:20px;color:var(--line)}
.badge.on{border-color:var(--gold);color:var(--fg)} .badge.on b{color:var(--gold)}
.cert{text-align:center;border:2px solid var(--gold);border-radius:18px;padding:26px 18px;background:radial-gradient(ellipse at center top,#3b2c10 0,transparent 70%)}
.cert h2{font-size:30px}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:14px;margin-top:18px}
.links button{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer}
.sec{margin-top:22px}
.why{margin:34px 0 8px;padding-top:14px;border-top:1px solid var(--line);color:var(--mute);font-size:12px;line-height:1.5}
.why b{color:var(--mute);font-weight:600}.why p{margin:3px 0 0}
body{margin:0;background:var(--bg)}
#emmsg.ok{font-size:13px;color:var(--ok)}
</style>
</head>

function dayPlan(day){
  const w = Math.min(4, Math.ceil(day/7)), t = S.answers.tiempo || '3', tema = S.answers.busca || 'paz';
  const items = PLAN.base.map((p,i)=>({id:'base'+p, icon:'🎵', title:'Step '+(i+1)+' · Psalm '+p, sub:i===0?'Close your eyes and connect':'', ps:p}));
  let paso = 4;
  if(t!=='3'){
    PLAN.temas[tema][w-1].forEach(p=>items.push({id:'tema'+p, icon:'🎵', title:'Step '+(paso++)+' · Psalm '+p, sub:'Your theme: '+PLAN.nombreTema[tema], ps:p}));
  }
  if(t==='7'){
    const sem = PLAN.temas[tema], rep = w===1 ? sem[0][0] : sem[w-2][0];
    items.push({id:'repaso', icon:'🔁', title:'Step '+(paso++)+' · Psalm '+rep, sub:'Review', ps:rep});
    items.push({id:'noche', icon:'🌙', title:'Step '+(paso++)+' · Psalm '+PLAN.noche, sub:'Before bed', ps:PLAN.noche});
  }
  items.push({id:'gracias', icon:'🙌', title:'Give thanks', sub:'Write one thing you’re thankful for today', text:true});
  items.push({id:'comparte', icon:'💌', title:'Share it', sub:'Invite someone to do the challenge with you', share:91});
  if(day%7===0) items.push({id:'prueba', icon:'🏅', title:'Do you know it? Sing the beginning without looking', sub:'If you can, you earn the Psalm '+PLAN.insignias[w-1]+' badge'});
  return {w, nuevo:PLAN.base[Math.min(2,w-1)], items};
}
const need = n => Math.min(3, n);
function doneCount(day){ const d=S.done[day]||{}; return Object.values(d).filter(Boolean).length; }
function dayComplete(day){ return doneCount(day) >= need(dayPlan(day).items.length); }
function streak(upTo){ let s=0; for(let d=upTo; d>=1; d--){ if(dayComplete(d)) s++; else if(d===upTo) continue; else break; } return s; }
function link(ps){ const p=S.answers.plataforma||'youtube'; return (PLAN.enlaces[ps]&&PLAN.enlaces[ps][p]) || PERFIL[p]; }

  if(q.time){
    body = `<input class="timeinput" type="time" id="hora" value="${S.answers.hora||'07:00'}" aria-label="Your free moment">
            <button class="btn" id="nx">Continue</button>`;
  } else {
    body = `<div class="opts ${q.logos?'two':''}">` + q.opts.map(o=> q.logos
      ? `<button class="opt logo ${S.answers[q.id]===o[0]?'on':''}" data-v="${o[0]}" aria-label="${o[2]}"><img src="${o[1]}" alt="${o[2]}"></button>`
      : `<button class="opt ${S.answers[q.id]===o[0]?'on':''}" data-v="${o[0]}"><span class="ic">${o[1]}</span><span>${o[2]}${o[3]?`<small>${o[3]}</small>`:''}</span></button>`
    ).join('') + `</div>`;
  }
  render(bar + `<div class="kicker">Question ${n} of ${total}</div><p class="q">${q.q}</p>` + body +
    (qi>0?`<div class="links"><button id="bk">Back</button></div>`:''));
  if(q.time){ document.getElementById('nx').onclick = ()=>{ S.answers.hora = document.getElementById('hora').value||'07:00'; save(); next(); }; }
  V.querySelectorAll('.opt').forEach(b=> b.onclick = ()=>{ S.answers[q.id]=b.dataset.v; save(); b.classList.add('on'); setTimeout(next, 180); });
  const bk=document.getElementById('bk'); if(bk) bk.onclick=()=>{ qi--; question(); };
}
function next(){ qi++; if(qi<QS.length) question(); else preparing(); }

function preparing(){
  const steps = ['Choosing your Psalms','Arranging your 4 weeks','Preparing your daily tasks','Fitting your daily time'];
  render(`<div class="center"><div class="spin" aria-hidden="true"></div><h2>Preparing your 28-day journey…</h2>
    <ul class="steps">${steps.map(s=>`<li>${s}</li>`).join('')}</ul></div>`);
  const lis = V.querySelectorAll('.steps li'); let i=0;
  const tick = setInterval(()=>{ if(i<lis.length){ lis[i++].classList.add('done'); } else { clearInterval(tick); ready(); } }, 650);
}

function ready(){
  const a=S.answers, t={3:'10 minutes (3 Psalms)',5:'15–20 minutes (5 Psalms)',7:'25–30 minutes (7 Psalms)'}[a.tiempo];
  const con={solo:'On your own',familia:'With your family',iglesia:'With your church'}[a.con];
  render(`<div class="center"><div class="kicker">Your challenge is ready</div><h2>Your 28-day journey</h2></div>
  <div class="ladder">${[0,1,2,3].map(i=>`<div><span>Week ${i+1}</span><b>${a.tiempo==='3'?PLAN.insignias[i]:PLAN.temas[a.busca||'paz'][i].join(' · ')}</b><span>${a.tiempo==='3'?'Base: 1 · 100 · 91':'+ base 1 · 100 · 91'}</span></div>`).join('')}</div>
  <div class="card"><dl class="summary">
    <dt>Each day</dt><dd>${t}</dd>
    <dt>Your theme</dt><dd>${PLAN.nombreTema[a.busca]||''}</dd>
    <dt>You listen on</dt><dd>${PLAT[a.plataforma]}</dd>
    <dt>Your reminder</dt><dd>${a.hora}</dd>
    <dt>You’re doing it</dt><dd>${con}</dd></dl></div>
  <p class="center" style="margin-top:12px">By the end you will know <b>Psalms 1, 100 and 91 by heart</b>.</p>
  <h3 class="sec">How would you like to receive your Psalm each morning?</h3>
  <p class="verse" style="font-size:17px">“Freely ye have received, freely give”<small>Matthew 10:8</small></p>
  <p style="color:var(--mute);font-size:14px">That’s why this challenge is free, forever. Choose one or more ways to receive it.</p>
  ${reminders()}
  <button class="btn" id="start">Start my Day 1</button>`);
  wireReminders();
  document.getElementById('start').onclick = async ()=>{
    // Si ha escrito su email y aún no lo ha enviado, lo apuntamos también al pulsar el botón principal
    const e=(document.getElementById('email').value||'').trim();
    if(e && S.email!==e){
      const ok=document.getElementById('ok').checked, m=document.getElementById('emmsg'); m.hidden=false;
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){ m.className='pending'; m.textContent='Please enter a valid email, for example name@gmail.com.'; m.scrollIntoView({block:'center'}); return; }
      if(!ok){ m.className='pending'; m.textContent='Please tick the box to agree to receive the challenge by email.'; m.scrollIntoView({block:'center'}); return; }
      const sent = await enviarEmail(e);
      if(!sent){ m.scrollIntoView({block:'center'}); return; }
    }
    S.start = S.groupStart || iso(today()); save(); dayView(); };
}

function reminders(){
  return `<div class="rem">
    <div class="card"><h3>📧 Email</h3><p>Get your day in your inbox every morning.</p>
      <input type="email" id="email" placeholder="you@email.com" autocomplete="email" value="${esc(S.email||'')}">
      <label class="chk"><input type="checkbox" id="ok"> I agree to receive the challenge by email. I can unsubscribe at any time. <a href="privacy.html" target="_blank" style="color:#e2c275">Privacy</a></label>
      <button class="mini" id="em">Get it by email</button><span id="emmsg" hidden></span></div>
    <div class="card"><h3>📅 Reminder in my calendar</h3><p>A daily reminder is added at ${S.answers.hora||'07:00'} for 28 days, with the link to your day.</p>
      <a class="mini" id="gcal" target="_blank" rel="noopener">Add to Google Calendar</a>
      <button class="mini" id="ics">Add to iPhone / other calendar</button><span class="pending" id="icsmsg" hidden>Your calendar file is downloading. Open it to add the reminder.</span></div>
  </div>`;
}
function wireReminders(){
  const h=(S.answers.hora||'07:00').replace(':',''), st=(S.groupStart||iso(today())).replace(/-/g,'');
  const end = String(Number(h)+10).padStart(4,'0');
  let tz='America/Mexico_City'; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz; }catch(e){}
  const title='Your Psalm of the day · 28-Day Challenge', det='Open your challenge day: '+WEB;
  document.getElementById('gcal').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+
    '&details='+encodeURIComponent(det)+'&dates='+st+'T'+h+'00/'+st+'T'+end+'00&ctz='+encodeURIComponent(tz)+'&recur='+encodeURIComponent('RRULE:FREQ=DAILY;COUNT=28');
  document.getElementById('gcal').addEventListener('click',()=>{ try{ window.goatcounter&&goatcounter.count({path:'en/challenge-calendar-google',title:'Challenge EN · Google Calendar',event:true}); }catch(_){} });
  document.getElementById('ics').onclick = ()=>{
    try{ window.goatcounter&&goatcounter.count({path:'en/challenge-calendar-iphone',title:'Challenge EN · iPhone / other calendar',event:true}); }catch(_){}
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Amen Hallelujah Official//28-Day Challenge//EN','BEGIN:VEVENT','UID:reto28-'+st+'@amenhallelujahofficial',
      'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTSTART:'+st+'T'+h+'00','DURATION:PT10M','RRULE:FREQ=DAILY;COUNT=28',
      'SUMMARY:'+title,'DESCRIPTION:'+det,'URL:'+WEB,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+title,'TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download='28-day-psalms-challenge.ics'; a.click(); }catch(e){}
    document.getElementById('icsmsg').hidden=false;
  };
  document.getElementById('em').onclick = ()=>{
    const e=document.getElementById('email').value.trim(), ok=document.getElementById('ok').checked, m=document.getElementById('emmsg');
    m.hidden=false;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){ m.className='pending'; m.textContent='Please enter a valid email, for example name@gmail.com.'; return; }
    if(!ok){ m.className='pending'; m.textContent='Please tick the box to agree to receive the challenge by email.'; return; }
    enviarEmail(e);
  };
}
function fechaLarga(s){ try{ return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ return s; } }
function enviarEmail(e){
  const m=document.getElementById('emmsg'), b=document.getElementById('em'); m.hidden=false;
  b.disabled=true; m.className='pending'; m.textContent='Sending…';
  const a=S.answers, clean=x=>String(x||'').replace(/[|\n]/g,' ');
  const fut=(S.groupStart && S.groupStart>iso(today()))?S.groupStart:'';
  const datos=['v1','alta',e,a.busca,a.tiempo,a.plataforma,a.hora,a.con,'en'].map(clean).concat(fut?['inicio='+fut]:[]).join('|');
  const fd=new FormData(); fd.append(GFIELD,datos);
  return fetch(GFORM,{method:'POST',mode:'no-cors',body:fd}).then(()=>{
    S.email=e; save(); m.className='ok'; m.textContent=(fut?'Done! Your Day 1 will arrive on '+fechaLarga(fut)+' at ':'Done! Your Day 1 will arrive today at ')+e+'. If you don’t see it, check your Promotions or Spam folder.';
    try{ window.goatcounter&&goatcounter.count({path:'en/challenge-email-ok',event:true}); }catch(_){}
    return true;
  }).catch(()=>{ b.disabled=false; m.className='pending'; m.textContent='No connection. Please try again in a moment.'; return false; });
}

function dayView(){
  const today_n = dayNum();
  if(today_n<1){ // grupo que empieza más adelante
    render(`<div class="center"><h2>Your challenge starts on ${fechaLarga(S.start)}</h2><p class="lead">We’ll be waiting for you that day with your Day 1.</p></div>`); return;
  }
  const cur = Math.min(28, today_n);
  const day = selDay && selDay<=cur ? selDay : cur;
  const P = dayPlan(day), d = S.done[day]||{};
  const plat = S.answers.plataforma||'youtube';
  const items = P.items.map(it=>{
    const on = !!d[it.id];
    let extra='';
    if(it.ps){ extra = `<a class="listen" href="${link(it.ps)}" target="_blank" rel="noopener" data-task="${it.id}"><img src="../img/${plat}.png" alt="">Listen on ${PLAT[plat]}</a>` }
    if(it.text) extra = `<textarea id="thx${day}" aria-label="I’m thankful for…" placeholder="Today I’m thankful for…">${esc(S.thanks[day]||'')}</textarea>`;
    if(it.share){ const msg='Today I’m listening to Psalm '+it.share+' in the 28-day challenge with the Psalms by Amen Hallelujah Official. It’s free, join me: '+WEB;
      extra = `<a class="listen" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" data-task="comparte">Send on WhatsApp</a>`; }
    return `<label class="task ${on?'done':''}"><input type="checkbox" data-id="${it.id}" ${on?'checked':''} aria-label="${esc(it.title)}">
      <div class="d"><div class="t" style="color:var(--fg)">${it.icon} ${it.title}${it.sub?`<em>${it.sub}</em>`:''}</div>${extra}</div></label>`;
  }).join('');
  const nd = need(P.items.length), c = doneCount(day);
  const finished = [...Array(28)].every((_,i)=>dayComplete(i+1));
  const grid = [...Array(28)].map((_,i)=>{ const n=i+1, cls=[dayComplete(n)?'done':(doneCount(n)?'part':''), n===cur?'today':'', n===day?'sel':''].join(' ');
    return `<button class="${cls}" data-day="${n}" ${n>cur?'disabled':''} aria-label="Day ${n}">${n}</button>`; }).join('');
  const badges = PLAN.insignias.map((p,i)=>{ const got = dayComplete((i+1)*7) && (S.done[(i+1)*7]||{}).prueba;
    return `<div class="badge ${got?'on':''}"><b>${p}</b>${got?'I know it':'Week '+(i+1)}</div>`; }).join('');
  render(`
    ${finished?`<div class="cert"><div class="kicker">Challenge completed</div><h2>You did it!</h2>
      <p class="lead">28 days with the Psalms. Now you know Psalms 1, 100 and 91 by heart.</p>
      <a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('I’ve completed the 28-day challenge with the Psalms by Amen Hallelujah Official. It’s free, start yours too: '+WEB)}">Share my achievement</a></div>`:''}
    <div class="dayhead"><div><div class="kicker">Week ${P.w}</div><div class="big">Day ${day} <small>of 28</small></div></div>
      <div class="streak"><b>${streak(cur)} 🔥</b>days in a row</div></div>
    ${day<cur?`<p class="daystate">You’re catching up on an earlier day. <button class="mini" id="tod" style="padding:3px 10px">Back to today</button></p>`:''}
    <div class="tasks">${items}</div>
    <p class="daystate ${c>=nd?'ok':''}">${c>=nd?'✓ Day complete. Blessings!':'Tick '+nd+' tasks to complete the day ('+c+' of '+nd+')'}</p>
    <h3 class="sec">Your 28 days</h3>
    <div class="grid28">${grid}</div>
    <p style="font-size:13px;color:var(--mute)">Missed a day? Tap it to catch up.</p>
    <h3 class="sec">Your badges</h3>
    <div class="badges">${badges}</div>
    <div class="card"><h3 style="font-size:16px">🔔 Your reminders</h3>${reminders()}</div>
    <div class="links"><button id="chg">Change my answers</button><button id="rst">Start over</button></div>`);
  V.querySelectorAll('.task input').forEach(x=> x.onchange = ()=>{ S.done[day]=S.done[day]||{}; S.done[day][x.dataset.id]=x.checked; save(); dayView(); });
  V.querySelectorAll('a[data-task]').forEach(a=> a.addEventListener('click', ()=>{ S.done[day]=S.done[day]||{}; S.done[day][a.dataset.task]=true; save(); setTimeout(dayView,300); }));
  const ta=document.getElementById('thx'+day); if(ta) ta.oninput=()=>{ S.thanks[day]=ta.value; if(ta.value.trim()){ S.done[day]=S.done[day]||{}; if(!S.done[day].gracias){ S.done[day].gracias=true; ta.closest('.task').querySelector('input').checked=true; } } save(); };
  if(ta) ta.onblur=()=>dayView();
  V.querySelectorAll('.grid28 button[data-day]').forEach(b=> b.onclick=()=>{ selDay=Number(b.dataset.day); dayView(); });
  const tod=document.getElementById('tod'); if(tod) tod.onclick=()=>{ selDay=null; dayView(); };
  document.getElementById('chg').onclick=()=>{ home(); };
  const rst=document.getElementById('rst');
  rst.onclick=()=>{ if(rst.dataset.c){ S={answers:{},start:null,done:{},thanks:{},email:null}; save(); sim=0; selDay=null; home(); } else { rst.dataset.c=1; rst.textContent='Tap again to erase your progress'; } };
  wireReminders();
}

/* Solo borrador: avanzar días para revisar el reto completo */
function drawSim(){
  const el=document.getElementById('sim');
  if(!/borrador/.test(location.search)){ const d=document.getElementById('draft'); if(d) d.style.display='none'; return; }
  if(!S.start){ el.innerHTML=''; return; }
  el.innerHTML=`Simulate day: <button id="sm">−</button> <b style="letter-spacing:0">${Math.max(1,Math.min(28,dayNum()))}</b> <button id="sp">+</button> <button id="sf">Fill days</button>`;
  document.getElementById('sm').onclick=()=>{ sim=Math.max(sim-1,0); selDay=null; dayView(); };
  document.getElementById('sp').onclick=()=>{ if(dayNum()<28){ sim++; selDay=null; dayView(); } };
  document.getElementById('sf').onclick=()=>{ for(let n=1;n<dayNum();n++){ const P=dayPlan(n); S.done[n]={}; P.items.forEach(i=>S.done[n][i.id]=true); } save(); dayView(); };
}

(S.start ? dayView : home)();
</script>
</body>
</html>
